<div class="page-container">

  <!-- Header unificado -->
  <div class="page-header">
    <button class="btn-back" routerLink="/talentoHumano/turnos/dashboard">
      <i class="pi pi-arrow-left"></i> Volver
    </button>
    <div class="header-icon">
      <i class="pi pi-cog"></i>
    </div>
    <div class="header-content">
      <h1>Configuración de Turnos</h1>
      <p>Parámetros de jornada, recargos y cierre del cuadro</p>
    </div>

    <!-- Selector de empresa GLOBAL (aplica a los 3 tabs) -->
    <div class="empresa-selector" *ngIf="empresasLoaded">
      <span class="empresa-selector-label"><i class="pi pi-building"></i> Empresa</span>
      <p-dropdown *ngIf="esAdmin"
        [options]="empresasOptions"
        [(ngModel)]="selectedEmpresa"
        optionLabel="label"
        optionValue="value"
        placeholder="Selecciona empresa"
        (onChange)="onEmpresaChange()"
        [style]="{'min-width':'240px'}">
      </p-dropdown>
      <span *ngIf="!esAdmin" class="empresa-selector-fijo">{{ getNombreEmpresaSel() }}</span>
    </div>
  </div>

  <!-- Tabs: el selector de empresa de arriba se comparte con los 3 tabs vía [idEmpresa]. -->
  <p-tabView styleClass="config-tabs">
    <p-tabPanel>
      <ng-template pTemplate="header">
        <i class="pi pi-clock tab-icon"></i>
        <span>Parámetros de Jornada</span>
      </ng-template>
      <app-parametrizacion [idEmpresa]="selectedEmpresa"></app-parametrizacion>
    </p-tabPanel>

    <p-tabPanel>
      <ng-template pTemplate="header">
        <i class="pi pi-lock tab-icon"></i>
        <span>Cierre de Cuadro</span>
      </ng-template>
      <app-cierre-cuadro [idEmpresa]="selectedEmpresa"></app-cierre-cuadro>
    </p-tabPanel>

    <p-tabPanel>
      <ng-template pTemplate="header">
        <i class="pi pi-list tab-icon"></i>
        <span>Conceptos Cuadro</span>
      </ng-template>
      <app-conceptos-cuadro [idEmpresa]="selectedEmpresa"></app-conceptos-cuadro>
    </p-tabPanel>
  </p-tabView>

</div>
