<div class="page-container">
  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>

  <!-- Header -->
  <div class="page-header-modern">
    <div class="header-top">
      <button class="btn-back-modern" routerLink="/talentoHumano">
        <i class="pi pi-arrow-left"></i>
        Volver
      </button>
    </div>
    <div class="header-main">
      <div class="header-title-section">
        <h1 class="page-title-modern">
          <i class="pi pi-file-export me-2"></i>
          Reportes de Turnos
        </h1>
        <p class="page-subtitle-modern">Generación de reportes y gestión del cuadro de turnos</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-nav">
      <button class="tab-btn" [class.active]="activeTab === 'selector'" (click)="setTab('selector')">
        <i class="pi pi-calendar me-2"></i>Selector
      </button>
    </div>
  </div>

  <div class="dashboard-content">

    <!-- ===== Tab: Selector → REPORTES ===== -->
    <ng-container *ngIf="activeTab === 'selector'">
      <div class="section-card">
        <div class="section-card-header">
          <h2 class="section-card-title"><i class="pi pi-file-export me-2"></i>Generar Reporte de Turnos</h2>
        </div>
        <div class="section-card-body">

          <!-- Toggle modo: Personal vs Unidad Funcional -->
          <div class="report-mode-toggle">
            <button class="mode-btn" [class.active]="reportMode === 'personal'" (click)="reportMode = 'personal'; reportData = null">
              <i class="pi pi-user"></i> Por Empleado
            </button>
            <button class="mode-btn" [class.active]="reportMode === 'unidad'" (click)="reportMode = 'unidad'; reportData = null">
              <i class="pi pi-sitemap"></i> Por Unidad Funcional
            </button>
          </div>

          <div class="selector-grid">
            <div class="selector-group">
              <label class="selector-label">Empresa / Clínica</label>
              <p-dropdown
                [(ngModel)]="selectedEmpresa"
                [options]="empresasOptions"
                placeholder="Selecciona una empresa"
                [showClear]="true"
                [loading]="isLoadingEmpresas"
                (onChange)="onEmpresaChange()"
                appendTo="body"
                styleClass="w-100">
              </p-dropdown>
            </div>

            <div class="selector-group">
              <label class="selector-label">Unidad Funcional</label>
              <p-dropdown
                [(ngModel)]="selectedUnidadFuncional"
                [options]="unidadesFuncionalesOptions"
                placeholder="Selecciona una unidad"
                [showClear]="true"
                [loading]="isLoadingUnidades"
                [disabled]="!selectedEmpresa"
                (onChange)="onUnidadFuncionalChange()"
                appendTo="body"
                styleClass="w-100">
              </p-dropdown>
            </div>

            <div class="selector-group" *ngIf="reportMode === 'personal'">
              <label class="selector-label">Empleado</label>
              <p-dropdown
                [(ngModel)]="selectedEmpleado"
                [options]="empleadosOptions"
                placeholder="Selecciona un empleado"
                [showClear]="true"
                [loading]="isLoadingEmpleados"
                [disabled]="!selectedUnidadFuncional"
                [filter]="true"
                appendTo="body"
                styleClass="w-100">
              </p-dropdown>
            </div>

            <div class="selector-group">
              <label class="selector-label">Mes y Año</label>
              <p-calendar
                [(ngModel)]="selectedMesFecha"
                view="month"
                dateFormat="MM yy"
                [showIcon]="true"
                [readonlyInput]="true"
                [inline]="false"
                placeholder="Selecciona mes/año"
                styleClass="w-100"
                panelStyleClass="calendar-mes-panel"
                (onSelect)="onMesFechaChange()">
              </p-calendar>
            </div>

            <div class="selector-actions">
              <button pButton type="button" label="Generar Reporte" icon="pi pi-search"
                class="p-button-primary" (click)="generarReporte()"
                [disabled]="!selectedMesFecha || !selectedUnidadFuncional || (reportMode === 'personal' && !selectedEmpleado)">
              </button>
              <button pButton type="button" label="Exportar Excel" icon="pi pi-file-excel"
                class="p-button-success" (click)="exportarExcel()"
                [disabled]="!reportData">
              </button>
            </div>
          </div>

          <!-- GRILLA DE REPORTE -->
          <div class="report-grilla" *ngIf="reportData">
            <div class="report-grilla-header">
              <h3>
                <i class="pi pi-calendar"></i>
                {{ reportData.titulo }}
              </h3>
              <span class="report-periodo">{{ reportData.periodo }}</span>
            </div>

            <div class="report-table-wrap">
              <table class="report-table">
                <thead>
                  <tr>
                    <th class="col-empleado">Empleado</th>
                    <th *ngFor="let d of reportData.dias" class="col-dia"
                        [class.festivo]="d.esFestivo" [class.domingo]="d.esDomingo">
                      <span class="dia-num">{{ d.numero }}</span>
                      <span class="dia-letra">{{ d.letra }}</span>
                    </th>
                    <th class="col-total">Total h</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let fila of reportData.filas">
                    <td class="col-empleado">{{ fila.nombre }}</td>
                    <td *ngFor="let celda of fila.celdas" class="col-dia"
                        [class.turno-celda]="celda.turno && !celda.esDescanso"
                        [class.descanso-celda]="celda.esDescanso"
                        [class.festivo]="celda.esFestivo"
                        [style.background-color]="celda.color || ''"
                        [pTooltip]="celda.tooltip" tooltipPosition="top">
                      <span *ngIf="celda.codigo">{{ celda.codigo }}</span>
                      <span *ngIf="celda.esDescanso">D</span>
                    </td>
                    <td class="col-total">{{ fila.totalHoras }}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
    </ng-container>

  </div>

</div>
