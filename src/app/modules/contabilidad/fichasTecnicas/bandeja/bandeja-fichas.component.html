<p-toast position="top-right" />

@if (generandoPdf()) {
  <div class="ft-pdf-overlay">
    <div class="ft-pdf-overlay__box">
      <p-progressSpinner strokeWidth="4" ariaLabel="Generando PDF" />
      <span>Generando PDF…</span>
    </div>
  </div>
}

<section class="ft-bandeja">
  <header class="ft-bandeja__header">
    <div>
      <h1>{{ info().titulo }}</h1>
      <p>{{ info().descripcion }}</p>
    </div>

    @if (meta()?.total !== undefined) {
      <span class="ft-bandeja__conteo">{{ meta()?.total | number }} fichas</span>
    }
  </header>

  <!-- Tarjetas KPI: la primera refleja la bandeja activa (Borradores, Vigentes…) -->
  <app-kpis-bandeja [bandeja]="bandeja()" [conteoActual]="meta()?.total ?? null" />

  <app-filtros-bandeja (cambio)="onFiltros($event)" />

  <app-tabla-fichas
    [fichas]="fichas()"
    [meta]="meta()"
    [cargando]="cargando()"
    [puedeValidar]="info().permiteValidar"
    [mensajeVacio]="info().vacio"
    (accion)="onAccion($event)"
    (cargarPagina)="onLazyLoad($event)"
  />
</section>
