<app-excel-sheet
  [config]="excelConfig()"
  [cellInfo]="cellInfo()"
  [loading]="isLoading()"
  (secondaryAction)="onSecondaryAction($event)"
  (ribbonAction)="onRibbonAction($event)"
  (formulaCommit)="onFormulaCommit($event)"
  (zoomChange)="onZoomChange($event)">

  <!-- ══ Vista en mantenimiento ══ -->
  <div *ngIf="isMaintenanceMode()" class="bi-panel bi-panel-warn">
    <i class="pi pi-wrench"></i>
    <h3>Vista en mantenimiento</h3>
    <p>{{ maintenanceMessage() }}</p>
  </div>

  <!-- ══ Filtros requeridos ══ -->
  <div *ngIf="showFilterRequired() && !isMaintenanceMode()" class="bi-panel bi-panel-filters">
    <div class="bi-filter-header">
      <i class="pi pi-filter"></i>
      <strong>Filtros requeridos</strong>
      <span class="bi-filter-msg">{{ filterRequiredMessage() }}</span>
    </div>
    <div class="bi-filter-fields">
      <div class="bi-filter-field" *ngFor="let col of filterColumns()">
        <label>{{ humanizeColumnName(col.name) }}</label>
        <input *ngIf="getColumnType(col.type) === 'date'" type="date"
          (change)="onSuggestedFilter(col.name, $any($event.target).value)">
        <input *ngIf="getColumnType(col.type) === 'number'" type="number"
          (input)="onSuggestedFilter(col.name, $any($event.target).value)">
        <select *ngIf="getColumnType(col.type) === 'boolean'"
          (change)="onSuggestedFilter(col.name, $any($event.target).value)">
          <option value="">Todos</option>
          <option value="1">Sí</option>
          <option value="0">No</option>
        </select>
        <input *ngIf="getColumnType(col.type) === 'text'" type="text"
          (input)="onSuggestedFilter(col.name, $any($event.target).value)">
      </div>
    </div>
    <button type="button" class="bi-filter-apply" (click)="aplicarFiltrosRequeridos()">
      <i class="pi pi-play"></i> Aplicar filtros
    </button>
  </div>

  <!-- ══ Error ══ -->
  <div *ngIf="errorMessage() && !isMaintenanceMode() && !showFilterRequired()" class="bi-error">
    <i class="pi pi-exclamation-triangle"></i> {{ errorMessage() }}
  </div>

  <!-- ══ Grid ══ -->
  <div *ngIf="!isMaintenanceMode() && !showFilterRequired()" class="bi-grid-wrap">
    <app-grid-loader *ngIf="isLoading() && rowData().length === 0"></app-grid-loader>

    <ag-grid-angular
      *ngIf="!isLoading() || rowData().length > 0"
      class="ag-theme-alpine bi-grid"
      [rowData]="rowData()"
      [columnDefs]="columnDefs()"
      [defaultColDef]="defaultColDef"
      [localeText]="localeText"
      [loading]="isLoading()"
      (gridReady)="onGridReady($event)"
      (sortChanged)="onSortChanged()"
      (filterChanged)="onFilterChanged()">
    </ag-grid-angular>
  </div>

</app-excel-sheet>
