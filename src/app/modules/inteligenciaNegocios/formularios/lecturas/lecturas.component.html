<p-toast></p-toast>

<div class="lecturas-container">
  <div class="lecturas-header">
    <h2><i class="pi pi-file-pdf"></i> Lecturas Imagenologia</h2>
    <span class="header-sub">Consulta de lecturas radiologicas por paciente o profesional</span>
  </div>

  <!-- Filtros en una sola linea -->
  <div class="filtros-row">
    <div class="filtro-item">
      <label class="filtro-label">Paciente</label>
      <p-autoComplete
        [(ngModel)]="selectedPaciente"
        [suggestions]="pacienteSuggestions"
        (completeMethod)="searchPaciente($event)"
        (onSelect)="onPacienteSelect($event)"
        field="label"
        placeholder="Documento o nombre (min 3 caracteres)..."
        [minLength]="3"
        [showClear]="true"
        [forceSelection]="false"
        styleClass="w-full"
        appendTo="body">
      </p-autoComplete>
    </div>

    <div class="filtro-item">
      <label class="filtro-label">Profesional</label>
      <p-autoComplete
        [(ngModel)]="profesionalFilter"
        [suggestions]="profesionalSuggestions"
        (completeMethod)="searchProfesional($event)"
        (onSelect)="onProfesionalSelect($event)"
        field="label"
        placeholder="Nombre del profesional (min 3 caracteres)..."
        [minLength]="3"
        [showClear]="true"
        [forceSelection]="false"
        styleClass="w-full"
        appendTo="body">
      </p-autoComplete>
    </div>

    <button class="btn-consultar" (click)="consultar()" [disabled]="isLoading">
      <i class="pi" [class.pi-search]="!isLoading" [class.pi-spin]="isLoading" [class.pi-spinner]="isLoading"></i>
      {{ isLoading ? 'Buscando...' : 'Consultar' }}
    </button>
  </div>

  <!-- Aviso -->
  @if (!consultado && !isLoading) {
    <div class="aviso-filtro">
      <i class="pi pi-info-circle"></i>
      Filtre por paciente o profesional para consultar las lecturas. Escriba al menos 3 caracteres.
    </div>
  }

  <!-- Resultados -->
  @if (consultado) {
    <div class="resultados-panel">
      <div class="resultados-header">
        <span class="resultados-count"><i class="pi pi-list"></i> {{ rowData.length }} lecturas</span>
      </div>
      <ag-grid-angular
        class="ag-theme-alpine"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [localeText]="localeText"
        [animateRows]="true"
        [pagination]="true"
        [paginationPageSize]="20"
        [domLayout]="'autoHeight'"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>
  }

  @if (isLoading) {
    <div class="loading-state"><app-grid-loader></app-grid-loader></div>
  }
</div>
