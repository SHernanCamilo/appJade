<p-toast position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>

<app-excel-sheet
  [config]="excelConfig()"
  [cellInfo]="cellInfo()"
  [loading]="isLoading()"
  (primaryAction)="guardar()"
  (secondaryAction)="onSecondaryAction($event)"
  (ribbonAction)="onRibbonAction($event)"
  (formulaCommit)="onFormulaCommit($event)"
  (zoomChange)="onZoomChange($event)">

  <!-- Grid goes inside via content projection -->
  <ag-grid-angular
    class="ag-theme-alpine xl-grid"
    [style.--xl-font-size]="gridFontSize()"
    [style.--ag-font-family]="gridFontFamily()"
    [rowData]="displayRows"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [gridOptions]="gridOptions"
    [localeText]="localeText"
    [tooltipShowDelay]="500"
    (contextmenu)="onContextMenu($event)"
    (gridReady)="onGridReady($event)"
    (cellFocused)="onCellFocused($event)"
    (cellValueChanged)="onCellValueChanged($event)">
  </ag-grid-angular>

</app-excel-sheet>

<!-- ═══════════ Menú contextual propio (clic derecho sobre un producto) ═══════════ -->
<!-- AG Grid Community no trae menú contextual; este es un menú ligero propio. -->
<div *ngIf="ctxMenu().visible"
     class="rt-ctx-backdrop"
     (click)="cerrarCtxMenu()"
     (contextmenu)="$event.preventDefault(); cerrarCtxMenu()">
  <ul class="rt-ctx-menu"
      [style.left.px]="ctxMenu().x"
      [style.top.px]="ctxMenu().y"
      (click)="$event.stopPropagation()">
    <li class="rt-ctx-item"
        [class.rt-ctx-disabled]="!puedeDesdoblar"
        (click)="puedeDesdoblar && desdoblarDesdeMenu()">
      <i class="pi pi-clone"></i> Desdoblar producto (otro CUM/Lote)
    </li>
    <li class="rt-ctx-item"
        [class.rt-ctx-disabled]="!puedeQuitarDesdoblamiento"
        (click)="puedeQuitarDesdoblamiento && quitarDesdeMenu()">
      <i class="pi pi-trash"></i> Quitar este desdoblamiento
    </li>
  </ul>
</div>
